<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./query.css" />
    <script
      src="https://kit.fontawesome.com/e34487146c.js"
      crossorigin="anonymous"
    ></script>
    <title>Profile Card -Sulyman Aishat</title>
  </head>
  <body>
    <article
      class="card-container"
      data-testid="profile-card"
      role="article"
      aria-label="Profile card for Sulyman Aishat"
    >
      <button
        class="menu-button"
        data-testid="menu-button"
        aria-label="Open menu"
        aria-haspopup="true"
        aria-expanded="false"
        onclick="handleMenuClick()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <header class="profile-header" data-testid="profile-header">
        <div class="avatar-container" data-testid="avatar-container">
          <img
            src="./Assets/image.png"
            alt="Sulyman Aishat profile picture"
            class="avatar"
            data-testid="profile-avatar"
          />
          <div
            class="avatar-badge"
            data-testid="avatar-badge"
            aria-label="Verified badge"
          >
            ✓
          </div>
        </div>

        <h1 class="profile-name" data-testid="profile-name">Sulyman Aishat</h1>
        <p class="profile-title" data-testid="profile-title">
          Frontend Developer
        </p>
      </header>

      <section
        class="stats-container"
        data-testid="stats-container"
        aria-label="Profile statistics"
      >
        <div class="stat-item" data-testid="stat-projects">
          <span class="stat-label" data-testid="stat-projects-label"
            >Projects</span
          >
          <span class="stat-value" data-testid="stat-projects-value">17</span>
        </div>

        <div class="stat-item" data-testid="stat-following">
          <span class="stat-label" data-testid="stat-following-label"
            >Following</span
          >
          <span class="stat-value" data-testid="stat-following-value">159</span>
        </div>

        <div class="stat-item" data-testid="stat-followers">
          <span class="stat-label" data-testid="stat-followers-label"
            >Followers</span
          >
          <span class="stat-value" data-testid="stat-followers-value">205</span>
        </div>
      </section>

      <p class="bio-text" data-testid="bio-text">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed et est et
        velit ornare ultrices. Ut vitae diam volutpat nunc eget.
      </p>

      <nav
        class="social-links"
        data-testid="social-links"
        aria-label="Social media links"
      >
        <a
          href="https://x.com/heryieshar"
          class="social-button twitter"
          data-testid="social-twitter"
          aria-label="Visit Twitter profile"
          target="_blank"
          rel="noopener noreferrer"
          onclick="handleSocialClick('twitter')"
        >
          <i class="fa-brands fa-x-twitter"></i>
        </a>

        <a
          href="https://facebook.com"
          class="social-button facebook"
          data-testid="social-facebook"
          aria-label="Visit Facebook profile"
          target="_blank"
          rel="noopener noreferrer"
          onclick="handleSocialClick('facebook')"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a
          href="https://google.com"
          class="social-button google"
          data-testid="social-google"
          aria-label="Visit Google profile"
          target="_blank"
          rel="noopener noreferrer"
          onclick="handleSocialClick('google')"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"
            />
          </svg>
        </a>

        <a
          href="https://github.com/nikkybel"
          class="social-button github"
          data-testid="social-github"
          aria-label="Visit Messenger profile"
          target="_blank"
          rel="noopener noreferrer"
          onclick="handleSocialClick('github')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            x="0px"
            y="0px"
            width="18"
            height="18"
            viewBox="0 0 50 50"
          >
            <path
              d="M17.791,46.836C18.502,46.53,19,45.823,19,45v-5.4c0-0.197,0.016-0.402,0.041-0.61C19.027,38.994,19.014,38.997,19,39 c0,0-3,0-3.6,0c-1.5,0-2.8-0.6-3.4-1.8c-0.7-1.3-1-3.5-2.8-4.7C8.9,32.3,9.1,32,9.7,32c0.6,0.1,1.9,0.9,2.7,2c0.9,1.1,1.8,2,3.4,2 c2.487,0,3.82-0.125,4.622-0.555C21.356,34.056,22.649,33,24,33v-0.025c-5.668-0.182-9.289-2.066-10.975-4.975 c-3.665,0.042-6.856,0.405-8.677,0.707c-0.058-0.327-0.108-0.656-0.151-0.987c1.797-0.296,4.843-0.647,8.345-0.714 c-0.112-0.276-0.209-0.559-0.291-0.849c-3.511-0.178-6.541-0.039-8.187,0.097c-0.02-0.332-0.047-0.663-0.051-0.999 c1.649-0.135,4.597-0.27,8.018-0.111c-0.079-0.5-0.13-1.011-0.13-1.543c0-1.7,0.6-3.5,1.7-5c-0.5-1.7-1.2-5.3,0.2-6.6 c2.7,0,4.6,1.3,5.5,2.1C21,13.4,22.9,13,25,13s4,0.4,5.6,1.1c0.9-0.8,2.8-2.1,5.5-2.1c1.5,1.4,0.7,5,0.2,6.6c1.1,1.5,1.7,3.2,1.6,5 c0,0.484-0.045,0.951-0.11,1.409c3.499-0.172,6.527-0.034,8.204,0.102c-0.002,0.337-0.033,0.666-0.051,0.999 c-1.671-0.138-4.775-0.28-8.359-0.089c-0.089,0.336-0.197,0.663-0.325,0.98c3.546,0.046,6.665,0.389,8.548,0.689 c-0.043,0.332-0.093,0.661-0.151,0.987c-1.912-0.306-5.171-0.664-8.879-0.682C35.112,30.873,31.557,32.75,26,32.969V33 c2.6,0,5,3.9,5,6.6V45c0,0.823,0.498,1.53,1.209,1.836C41.37,43.804,48,35.164,48,25C48,12.318,37.683,2,25,2S2,12.318,2,25 C2,35.164,8.63,43.804,17.791,46.836z"
            ></path>
          </svg>
        </a>
      </nav>

      <button
        class="view-profile-button"
        data-testid="view-profile-button"
        onclick="handleViewProfile()"
      >
        View Profile
      </button>
    </article>
    <script src="./script.js"></script>
  </body>
</html>
